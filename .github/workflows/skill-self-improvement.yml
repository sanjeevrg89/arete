# Outer loop (reviser) for the skill self-improvement loop — see skill-self-improvement/.
#
# This committed workflow runs the loop in DRY-RUN: it validates the feedback signal and prints the
# improvement candidates. It needs NO secrets and writes NOTHING. The real reviser step (invoke a coding
# agent to open a PR that diffs the underperforming skills) is documented at the bottom, gated, and
# NEVER auto-merges — a self-edit always goes through a human-reviewed PR + the verify gate (ci.yml).
name: skill-self-improvement

on:
  schedule:
    - cron: "0 10 * * 5"   # Fridays 10:00 UTC — the outer loop's heartbeat (the inner loop runs per-task)
  workflow_dispatch:        # and on-demand

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- The verify gate's mechanical layer (same as ci.yml) ---
      - name: Validate skill library
        run: python scripts/validate.py
      - name: Lint functional checks
        run: python scripts/functional_test.py --lint

      # --- The signal ---
      - name: Lint feedback records
        run: python scripts/skill_feedback.py --lint
      - name: Rank improvement candidates (what the reviser would consider)
        run: python scripts/skill_feedback.py

