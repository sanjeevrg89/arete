name: validate-skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install strict YAML parser and the Agent Skills reference validator
        run: pip install pyyaml==6.0.3 skills-ref==0.1.1
      - name: Validate skill library (strict YAML, router limits, layout)
        run: python scripts/validate.py
      - name: Agent Skills spec check (skills-ref) on first-party skills
        run: |
          fail=0
          for d in skills/*/; do
            [ "$(basename "$d")" = vendored ] && continue
            agentskills validate "$d" >/dev/null || { agentskills validate "$d"; fail=1; }
          done
          exit $fail
      - name: Lint routing cases (every skill has one)
        run: python scripts/routing_eval.py --lint
      - name: Lint functional checks
        run: python scripts/functional_test.py --lint
      - name: Lint agent check (library scan only; no agent CLIs on the runner)
        run: python scripts/agent_check.py --lint
      - name: Flat bundle is up to date
        run: |
          python scripts/build_bundle.py
          test -z "$(git status --porcelain -- bundle/)" || {
            echo "bundle/ is stale: run python scripts/build_bundle.py and commit the result"
            git status --porcelain -- bundle/
            exit 1
          }
